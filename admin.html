<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - KYC Cambalache</title>
  
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>[x-cloak] { display: none !important; }</style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#050B14',
              card: '#0D192D',
              input: '#07101E',
              gold: '#D4AF37',
              goldHover: '#F3C63F'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen font-sans antialiased" x-data="adminApp()" x-init="init()">

  <!-- 1. PANTALLA DE LOGIN -->
  <div x-show="!isLogged" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-brand-card p-8 rounded-2xl border border-brand-gold/40 max-w-md w-full space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-extrabold text-brand-gold">CAMBALACHE ADMIN</h1>
        <p class="text-xs text-slate-400">Ingresa tus credenciales para gestionar solicitudes KYC</p>
      </div>

      <form @submit.prevent="login()" class="space-y-4">
        <div>
          <label class="block text-xs mb-1 text-slate-300">Correo Electrónico</label>
          <input type="email" x-model="email" required class="w-full bg-brand-input border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:border-brand-gold focus:outline-none">
        </div>
        <div>
          <label class="block text-xs mb-1 text-slate-300">Contraseña</label>
          <input type="password" x-model="password" required class="w-full bg-brand-input border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:border-brand-gold focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-brand-dark font-bold py-2.5 rounded-lg text-xs transition shadow-lg">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD PRINCIPAL -->
  <div x-show="isLogged" x-cloak class="min-h-screen flex flex-col">
    <header class="bg-brand-card border-b border-brand-gold/30 py-4 px-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-brand-gold">Panel de Verificación KYC</h1>
        <span class="bg-slate-800 text-brand-gold text-[10px] border border-brand-gold/40 px-2.5 py-0.5 rounded-full font-mono" x-text="solicitudes.length + ' registros'"></span>
      </div>
      <button @click="logout()" class="text-xs text-rose-400 hover:underline">Cerrar Sesión</button>
    </header>

    <main class="max-w-7xl mx-auto p-6 flex-1 w-full">
      <div class="bg-brand-card rounded-2xl border border-brand-gold/30 overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-brand-dark text-brand-gold uppercase font-semibold border-b border-brand-gold/30">
              <tr>
                <th class="p-3 font-mono">#ID</th>
                <th class="p-3">Cliente</th>
                <th class="p-3">Documento</th>
                <th class="p-3">WhatsApp</th>
                <th class="p-3">Tipo Operación</th>
                <th class="p-3">Estado</th>
                <th class="p-3 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
              <template x-for="sol in solicitudes" :key="sol.id">
                <tr class="hover:bg-slate-800/60 transition">
                  <td class="p-3 font-mono text-brand-gold" x-text="'#' + sol.id"></td>
                  <td class="p-3 font-semibold text-slate-100" x-text="(sol.nombres || '') + ' ' + (sol.apellidos || '')"></td>
                  <td class="p-3" x-text="(sol.tipo_documento || '-') + ': ' + (sol.numero_documento || '-')"></td>
                  <td class="p-3" x-text="sol.whatsapp_principal || '-'"></td>
                  <td class="p-3" x-text="sol.tipo_operacion || '-'"></td>
                  <td class="p-3">
                    <span class="px-2.5 py-0.5 border rounded-full text-[10px] uppercase font-bold"
                          :class="sol.estado === 'aprobado' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : sol.estado === 'rechazado' ? 'bg-rose-500/20 text-rose-400 border-rose-500/40' : 'bg-amber-500/20 text-amber-400 border-amber-500/40'"
                          x-text="sol.estado"></span>
                  </td>
                  <td class="p-3 text-right space-x-1">
                    <button @click="verExpediente(sol)" class="px-2.5 py-1 bg-slate-800 border border-brand-gold/40 text-brand-gold rounded hover:bg-slate-700 transition">Ver Expediente</button>
                    <button @click="updateStatus(sol.id, 'aprobado')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded">✓</button>
                    <button @click="updateStatus(sol.id, 'rechazado')" class="px-2 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded">✕</button>
                    <button @click="deleteSolicitud(sol.id)" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded">🗑</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- 3. MODAL EXPEDIENTE REACTIVO -->
  <div x-show="modalAbierto" x-cloak class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-brand-card border border-brand-gold/50 rounded-2xl w-full max-w-4xl max-h-[92vh] overflow-y-auto p-6 space-y-6 text-xs text-slate-200 shadow-2xl" @click.away="modalAbierto = false">
      
      <div class="flex justify-between items-center border-b border-brand-gold/30 pb-3">
        <div>
          <h2 class="text-base font-bold text-brand-gold">Expediente de Verificación #<span x-text="solicitudSeleccionada?.id"></span></h2>
          <p class="text-[10px] text-slate-400" x-text="'Registrado el: ' + formatFecha(solicitudSeleccionada?.creado_en)"></p>
        </div>
        <button @click="modalAbierto = false" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>

      <template x-if="solicitudSeleccionada">
        <div class="space-y-6">
          
          <!-- DATOS PERSONALES -->
          <div class="bg-brand-input p-4 rounded-xl border border-slate-800 space-y-2">
            <h3 class="font-bold text-brand-gold border-b border-brand-gold/20 pb-1">1. Datos Personales</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              <div><span class="text-slate-400">Nombre Completo:</span> <span class="font-semibold text-slate-100" x-text="solicitudSeleccionada.nombres + ' ' + solicitudSeleccionada.apellidos"></span></div>
              <div><span class="text-slate-400">Documento:</span> <span x-text="solicitudSeleccionada.tipo_documento + ' - ' + solicitudSeleccionada.numero_documento"></span></div>
              <div><span class="text-slate-400">Email:</span> <span class="text-amber-400" x-text="solicitudSeleccionada.email"></span></div>
              <div><span class="text-slate-400">WhatsApp:</span> <span class="text-emerald-400" x-text="solicitudSeleccionada.whatsapp_principal"></span></div>
            </div>
          </div>

          <!-- GALERÍA R2 DIRECTA CON FALLBACK SVG -->
          <div class="bg-brand-input p-4 rounded-xl border border-slate-800 space-y-3">
            <h3 class="font-bold text-brand-gold border-b border-brand-gold/20 pb-1 flex justify-between items-center">
              <span>2. Documentos y Galería en Cloudflare R2</span>
              <span class="text-[10px] text-slate-400 font-mono" x-text="obtenerDocsValidos(solicitudSeleccionada).length + ' archivos'"></span>
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              <template x-for="doc in obtenerDocsValidos(solicitudSeleccionada)" :key="doc.key">
                <div class="bg-brand-dark p-3 rounded-xl border border-slate-700/80 flex flex-col items-center justify-between space-y-2 text-center group hover:border-brand-gold/50 transition">
                  <span class="font-semibold text-brand-gold text-[11px]" x-text="doc.title"></span>
                  
                  <template x-if="doc.key.endsWith('.pdf')">
                    <div class="w-full h-32 flex items-center justify-center bg-slate-900 rounded border border-slate-800 text-rose-400 text-3xl">
                      📄 PDF
                    </div>
                  </template>

                  <template x-if="!doc.key.endsWith('.pdf')">
                    <div class="w-full h-32 overflow-hidden rounded border border-slate-800 bg-black flex items-center justify-center">
                      <img :src="getPublicUrl(doc.key)" 
                           :alt="doc.title" 
                           class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300" 
                           loading="lazy" 
                           @error="$event.target.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' viewBox=\'0 0 150 150\'><rect width=\'100%\' height=\'100%\' fill=\'%230D192D\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23D4AF37\' font-size=\'10\' font-family=\'sans-serif\'>NO ENCONTRADO EN R2</text></svg>'">
                    </div>
                  </template>

                  <div class="w-full space-y-1">
                    <a :href="getPublicUrl(doc.key)" target="_blank" class="block w-full py-1.5 bg-brand-card hover:bg-slate-700 text-brand-gold text-[10px] rounded border border-brand-gold/30 font-semibold transition">
                      Abrir archivo ↗
                    </a>
                    <p class="font-mono text-[8px] text-slate-500 truncate" x-text="doc.key" :title="doc.key"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>

        </div>
      </template>
    </div>
  </div>

  <script>
    function adminApp() {
      return {
        isLogged: false,
        email: '',
        password: '',
        solicitudes: [],
        solicitudSeleccionada: null,
        modalAbierto: false,
        R2_PUBLIC_DOMAIN: 'https://pub-49b9c87f6e6a418ba422de5ba36ddc73e.r2.dev',

        init() {
          if (localStorage.getItem('admin_logged') === 'true') {
            this.isLogged = true;
            this.loadSolicitudes();
          }
        },

        async login() {
          try {
            const res = await fetch('/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: this.email, password: this.password })
            });
            const data = await res.json();
            if (data.success) {
              localStorage.setItem('admin_logged', 'true');
              this.isLogged = true;
              this.loadSolicitudes();
            } else {
              alert('Error: ' + data.error);
            }
          } catch (err) {
            alert('Error conectando con el servidor');
          }
        },

        logout() {
          localStorage.clear();
          location.reload();
        },

        async loadSolicitudes() {
          try {
            const res = await fetch('/api/admin/solicitudes');
            const data = await res.json();
            if (data.success) {
              this.solicitudes = data.solicitudes;
            }
          } catch (err) {
            console.error('Error al cargar solicitudes:', err);
          }
        },

        verExpediente(sol) {
          this.solicitudSeleccionada = sol;
          this.modalAbierto = true;
        },

        getPublicUrl(key) {
          if (!key) return '';
          return `${this.R2_PUBLIC_DOMAIN}/${key}`;
        },

        obtenerDocsValidos(sol) {
          if (!sol) return [];
          const docs = [
            { title: 'Doc Frente', key: sol.r2_doc_frente_key },
            { title: 'Doc Dorso', key: sol.r2_doc_dorso_key },
            { title: 'Selfie con Documento', key: sol.r2_doc_selfie_key },
            { title: 'Comprobante Domicilio', key: sol.r2_doc_domicilio_key },
            { title: 'Firma Digital', key: sol.r2_firma_key },
            { title: 'Documento Empresa', key: sol.r2_doc_empresa_key }
          ];
          return docs.filter(d => d.key);
        },

        formatFecha(fecha) {
          if (!fecha) return '-';
          return new Date(fecha).toLocaleString();
        },

        async updateStatus(id, estado) {
          if (!confirm(`¿Cambiar estado de #${id} a '${estado.toUpperCase()}'?`)) return;
          try {
            const res = await fetch(`/api/admin/solicitudes/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ estado })
            });
            const data = await res.json();
            if (data.success) this.loadSolicitudes();
          } catch (err) {
            alert('Error al actualizar estado');
          }
        },

        async deleteSolicitud(id) {
          if (!confirm(`⚠️ ¿ELIMINAR PERMANENTEMENTE la solicitud #${id}?`)) return;
          try {
            const res = await fetch(`/api/admin/solicitudes/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) this.loadSolicitudes();
          } catch (err) {
            alert('Error al eliminar registro');
          }
        }
      }
    }
  </script>
</body>
</html>
